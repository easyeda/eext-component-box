<!doctype html>
<html lang="zh-Hans">
<head>
	<meta charset="utf-8" />
	<title data-i18n="component_box">器件盒</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/iframe/style.css" />
</head>
<body>
	<div class="toolbar">
		<div class="connect-dropdown" id="connect-dropdown">
			<button type="button" id="btn-box-connect" class="btn btn-serial btn-sm" data-i18n="connect_device">连接设备</button>
			<div class="connect-menu" id="connect-menu">
				<div class="connect-menu-item" id="connect-serial" data-i18n="usb_serial">USB 串口</div>
				<div class="connect-menu-item" id="connect-ble" data-i18n="bluetooth">蓝牙</div>
			</div>
		</div>
		<label class="auto-connect-toggle">
			<input type="checkbox" id="auto-connect" />
			<span class="toggle-slider"></span>
			<span class="toggle-label" data-i18n="auto_connect">自动连接</span>
		</label>
		<button type="button" id="btn-sync" class="btn btn-sm btn-success" style="display:none;" data-i18n="sync">同步</button>
		<span id="status" class="status"></span>
	</div>
	<div class="box-hardware">
		<div id="box-grid" class="box-grid"></div>
		<div class="box-bottom">
			<div class="box-bottom-left">
				<div class="oled-display" id="oled-display">
					<div class="oled-conn-badge" id="oled-conn-badge"></div>
					<div class="oled-line oled-name" id="oled-name"></div>
					<div class="oled-line oled-qty" id="oled-qty"></div>
					<div class="oled-line oled-id" id="oled-id"></div>
				</div>
			</div>
			<div></div>
			<div class="box-bottom-right">
				<div class="dpad">
					<button type="button" class="dpad-btn dpad-up" id="dpad-up">&#9650;</button>
					<div class="dpad-mid-row">
						<button type="button" class="dpad-btn dpad-left" id="dpad-left">&#9664;</button>
						<button type="button" class="dpad-btn dpad-center" id="dpad-center">&#9679;</button>
						<button type="button" class="dpad-btn dpad-right" id="dpad-right">&#9654;</button>
					</div>
					<button type="button" class="dpad-btn dpad-down" id="dpad-down">&#9660;</button>
				</div>
			</div>
		</div>
	</div>

	<div id="picker-overlay" class="modal-overlay" style="display:none;">
		<div class="modal">
			<div class="modal-header">
				<span class="modal-title" data-i18n="select_component">选择器件</span>
				<button type="button" class="modal-close" id="picker-close">&times;</button>
			</div>
			<div class="modal-body">
				<div class="form-group">
					<input id="picker-search" placeholder="搜索器件（编号/名称）..." data-i18n-placeholder="search_by_id_or_name" />
				</div>
				<div id="picker-list" class="picker-list"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-danger" id="picker-clear" data-i18n="clear_mapping">清除映射</button>
				<span></span>
			</div>
		</div>
	</div>

	<script>
		var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
		function t(tag, ...args) {
			if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
			return tag;
		}
		document.querySelectorAll('[data-i18n]').forEach(function(el) {
			el.textContent = t(el.getAttribute('data-i18n'));
		});
		document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
			el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
		});
	</script>
	<script src="/iframe/box.js"></script>
</body>
</html>
