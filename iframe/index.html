<!doctype html>
<html lang="zh-Hans">
<head>
	<meta charset="utf-8" />
	<title data-i18n="personal_component_library">个人器件库</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/iframe/style.css" />
</head>
<body>
	<div class="toolbar">
		<button type="button" id="btn-import" class="btn btn-primary" data-i18n="import_order_sheet">导入订单表格</button>
		<button type="button" id="btn-delete-mode" class="btn btn-danger" data-i18n="delete_components">删除器件</button>
		<button type="button" id="btn-select-all" class="btn btn-sm" style="display:none;" data-i18n="select_all">全选</button>
		<button type="button" id="btn-confirm-delete" class="btn btn-sm btn-danger" style="display:none;" data-i18n="confirm_delete">确认删除</button>
		<button type="button" id="btn-cancel-delete" class="btn btn-sm" style="display:none;" data-i18n="cancel">取消</button>
		<button type="button" id="btn-box" class="btn btn-box" data-i18n="map_component_box">映射器件盒</button>
		<input type="text" id="search-input" placeholder="搜索器件（编号/名称/描述）..." data-i18n-placeholder="search_by_id_name_desc" />
		<span id="status" class="status"></span>
	</div>
	<div id="table-container">
		<table id="device-table">
			<thead>
				<tr>
					<th data-i18n="quantity">数量</th>
					<th data-i18n="product_id">商品编号</th>
					<th data-i18n="component_name">器件名称</th>
					<th data-i18n="package">封装</th>
					<th data-i18n="description">描述</th>
					<th data-i18n="manufacturer">制造商</th>
					<th data-i18n="actions">操作</th>
				</tr>
			</thead>
			<tbody id="device-tbody"></tbody>
		</table>
		<div id="empty-tip" class="empty-tip" data-i18n="no_components_tip">暂无器件，请点击"导入订单表格"添加</div>
	</div>

	<div id="modal-overlay" class="modal-overlay" style="display:none;">
		<div class="modal">
			<div class="modal-header">
				<span class="modal-title" data-i18n="edit_component">编辑器件</span>
				<button type="button" class="modal-close" id="modal-close">&times;</button>
			</div>
			<div class="modal-body" id="modal-body"></div>
			<div class="modal-footer">
				<button type="button" class="btn btn-danger" id="modal-delete" data-i18n="delete">删除</button>
				<button type="button" class="btn btn-primary" id="modal-save" data-i18n="save">保存</button>
			</div>
		</div>
	</div>

	<script>
		var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
		function t(tag, ...args) {
			if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
			return tag;
		}
		document.querySelectorAll('[data-i18n]').forEach(function(el) {
			el.textContent = t(el.getAttribute('data-i18n'));
		});
		document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
			el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
		});
	</script>
	<script src="/iframe/xlsx.full.min.js"></script>
	<script src="/iframe/app.js"></script>
</body>
</html>
